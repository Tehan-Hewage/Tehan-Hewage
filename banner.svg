<svg fill="none" width="100%" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0D0117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="cyanPurpleText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E7FF" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E7FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00C853" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 3px;
      fill: #FFFFFF;
    }

    .subtitle-text {
      font-family: monospace;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 2px;
      fill: #00E7FF;
      text-transform: uppercase;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% {
 opacity: 0.8; }
    }

    @keyframes floatWave {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .glowing-orb-1 {
      animation: pulseGlow 6s infinite ease-in-out;
    }

    .glowing-orb-2 {
      animation: pulseGlow 8s infinite ease-in-out 1s;
    }

    .animated-wave {
      animation: floatWave 4s infinite ease-in-out;
    }
  </style>

  <rect width="800" height="220" rx="16" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="1.5" />

  <circle class="glowing-orb-1" cx="180" cy="80" r="120" fill="#00E7FF" opacity="0.15" filter="url(#cyanGlow)" />
  <circle class="glowing-orb-2" cx="620" cy="110" r="140" fill="#7C3AED" opacity="0.2" filter="url(#purpleGlow)" />

  <path d="M0 40 H800 M0 90 H800 M0 140 H800 M0 190 H800" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
  <path d="M160 0 V220 M320 0 V220 M480 0 V220 M640 0 V220" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />

  <g transform="translate(400, 100)" text-anchor="middle">
    <text class="title-text" x="0" y="0" fill="url(#cyanPurpleText)" opacity="0.3" filter="url(#cyanGlow)">TEHAN HEWAGE</text>
    <text class="title-text" x="0" y="0">TEHAN HEWAGE</text>
    <text class="subtitle-text" x="0" y="38">SOFTWARE ENGINEER - FIRST CLASS HONOURS - AI &amp; FULL STACK</text>
  </g>
	 <g class="animated-wave">
     <path d="M 0,185 C 150,165 300,205 450,180 C 600,155 700,195 800,185 L 800 220 L 0 220 Z" fill="url(#waveGrad)" opacity="0.3" />
    "path d="M 0,195 C 200,180 350,210 500,190 C 650,170 720,205 800,195 L 800,220 L 0,220 Z" fill="url(#cyanPurpleText)" opacity="0.5" />
  </g>
</svg>